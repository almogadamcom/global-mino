<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Enquiries | Global Mino</title>
<link rel="stylesheet" href="/fonts.css">
<style>
:root{
  --ink:#101419; --panel:#1B1D20; --gold:#B88A2B; --gold-light:#C89D48;
  --paper:#F7F5F0; --muted:#D8D1C4; --white:#fff;
  --line:rgba(216,209,196,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--paper);
  font-family:"DM Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Libre Caslon Display","Times New Roman",Georgia,serif;font-weight:400;margin:0}
a{color:var(--gold-light)}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:32px;padding-left:20px;padding-right:20px}

/* ---------- gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate form{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);padding:34px}
.gate h1{font-size:30px;margin:14px 0 8px}
.gate p.sub{color:var(--muted);margin:0 0 22px;font-size:14px}
label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input,select{width:100%;padding:12px 14px;background:#14171b;border:1px solid var(--line);
  color:var(--paper);font:inherit;border-radius:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border:0;cursor:pointer;
  background:var(--gold);color:#14171b;font:inherit;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.btn:hover{background:var(--gold-light)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.ghost:hover{color:var(--paper);border-color:var(--muted)}
.err{color:#E7A5A5;font-size:13px;margin:14px 0 0;min-height:1.2em}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;
  border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:24px}
.top h1{font-size:34px;line-height:1.1}
.count{color:var(--muted);font-size:13px;margin:6px 0 0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:7px;
  vertical-align:middle;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools input,.tools select{width:auto;min-width:150px;padding:9px 12px;font-size:13px}

/* ---------- list ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-left:2px solid transparent;
  padding:20px 22px;margin-bottom:12px;transition:border-color .2s}
.card.fresh{border-left-color:var(--gold);background:#1e2024}
.card-top{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:space-between}
.card h3{font-size:21px}
.when{color:var(--muted);font-size:12px;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.tag{font-size:10px;letter-spacing:.13em;text-transform:uppercase;padding:4px 9px;
  border:1px solid var(--line);color:var(--muted)}
.tag.new{border-color:var(--gold);color:var(--gold);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:13px;color:var(--muted);margin-bottom:12px}
.msg{white-space:pre-wrap;color:var(--paper);border-top:1px solid var(--line);padding-top:13px;margin:0;
  font-size:14.5px}
.msg.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:0;color:var(--gold-light);cursor:pointer;font:inherit;font-size:12.5px;
  padding:8px 0 0;text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:70px 20px;border:1px dashed var(--line)}
.foot{color:var(--muted);font-size:12px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}
@media (max-width:520px){.top h1{font-size:26px}.tools{width:100%}.tools input,.tools select{flex:1}}
</style>
</head>
<body>

<div id="gate" class="gate">
  <form id="gate-form">
    <p class="eyebrow">Global Mino</p>
    <h1>Enquiries</h1>
    <p class="sub">Enter the dashboard access token to view submitted enquiries.</p>
    <label for="token">Access token</label>
    <input id="token" type="password" autocomplete="current-password" required>
    <p class="err" id="gate-error" role="alert"></p>
    <p style="margin-top:18px"><button class="btn" type="submit">Open dashboard</button></p>
  </form>
</div>

<div id="app" class="wrap" hidden>
  <div class="top">
    <div>
      <p class="eyebrow">Global Mino</p>
      <h1>Enquiries</h1>
      <p class="count" id="count"><span class="dot"></span>Loading…</p>
    </div>
    <div class="tools">
      <input id="search" type="search" placeholder="Search name, email, message…" aria-label="Search enquiries">
      <select id="country" aria-label="Filter by country"><option value="">All countries</option></select>
      <select id="interest" aria-label="Filter by interest"><option value="">All interests</option></select>
      <button class="btn ghost" id="csv" type="button">Export CSV</button>
      <button class="btn ghost" id="signout" type="button">Sign out</button>
    </div>
  </div>
  <div id="list"></div>
  <div class="foot">
    <span id="status">—</span>
    <span>Auto-refreshes every 30s · Contains personal data, handle accordingly.</span>
  </div>
</div>

<script>
const KEY='gm_admin_token', SEEN='gm_admin_seen';
const $=s=>document.querySelector(s);
const gate=$('#gate'), app=$('#app');
let rows=[], timer=null;

const LABEL=s=>s.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function ago(iso){
  const d=new Date(iso), s=(Date.now()-d)/1000;
  if(s<60)return 'just now';
  if(s<3600)return Math.floor(s/60)+' min ago';
  if(s<86400)return Math.floor(s/3600)+' hr ago';
  if(s<604800)return Math.floor(s/86400)+' d ago';
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}

async function load(){
  const token=sessionStorage.getItem(KEY);
  if(!token)return signOut();
  try{
    const r=await fetch('/api/enquiries',{headers:{Authorization:'Bearer '+token}});
    if(r.status===401){signOut('That token was not accepted.');return}
    if(!r.ok){$('#status').textContent='Could not refresh ('+r.status+'). Retrying…';return}
    rows=(await r.json()).rows||[];
    fillFilters(); render();
    $('#status').textContent='Updated '+new Date().toLocaleTimeString();
  }catch{ $('#status').textContent='Network error. Retrying…'; }
}

function fillFilters(){
  for(const [id,field] of [['#country','country'],['#interest','interest']]){
    const sel=$(id), cur=sel.value;
    const vals=[...new Set(rows.map(r=>r[field]))].sort();
    sel.length=1;
    for(const v of vals){const o=document.createElement('option');o.value=v;o.textContent=LABEL(v);sel.append(o)}
    sel.value=cur;
  }
}

function visible(){
  const q=$('#search').value.trim().toLowerCase(), c=$('#country').value, i=$('#interest').value;
  return rows.filter(r=>
    (!c||r.country===c) && (!i||r.interest===i) &&
    (!q||[r.name,r.email,r.company,r.phone,r.message].some(v=>String(v||'').toLowerCase().includes(q)))
  );
}

function render(){
  const seen=Number(sessionStorage.getItem(SEEN)||0);
  const list=visible();
  const fresh=rows.filter(r=>new Date(r.created_at).getTime()>seen).length;
  $('#count').innerHTML='<span class="dot"></span>'+rows.length+' total'
    +(fresh?' · <strong style="color:var(--gold)">'+fresh+' new</strong>':'')
    +(list.length!==rows.length?' · '+list.length+' shown':'');
  document.title=(fresh?'('+fresh+') ':'')+'Enquiries | Global Mino';

  if(!list.length){
    $('#list').innerHTML='<div class="empty"><p>'+(rows.length?'No enquiries match those filters.':'No enquiries yet.')+'</p></div>';
    return;
  }
  $('#list').innerHTML=list.map(r=>{
    const isNew=new Date(r.created_at).getTime()>seen;
    const long=String(r.message||'').length>240;
    return '<article class="card'+(isNew?' fresh':'')+'">'
      +'<div class="card-top"><h3>'+esc(r.name)+(r.company?' <span style="color:var(--muted);font-size:15px">· '+esc(r.company)+'</span>':'')+'</h3>'
      +'<span class="when" title="'+esc(new Date(r.created_at).toLocaleString())+'">'+ago(r.created_at)+'</span></div>'
      +'<div class="tags">'+(isNew?'<span class="tag new">New</span>':'')
      +'<span class="tag">'+esc(LABEL(r.country))+'</span><span class="tag">'+esc(LABEL(r.interest))+'</span></div>'
      +'<div class="meta"><a href="mailto:'+esc(r.email)+'?subject='+encodeURIComponent('Re: your enquiry to Global Mino')+'">'+esc(r.email)+'</a>'
      +(r.phone?'<a href="tel:'+esc(r.phone)+'">'+esc(r.phone)+'</a>':'')+'</div>'
      +'<p class="msg'+(long?' clip':'')+'">'+esc(r.message)+'</p>'
      +(long?'<button class="more" type="button">Show full message</button>':'')
      +'</article>';
  }).join('');
}

$('#list').addEventListener('click',e=>{
  if(!e.target.classList.contains('more'))return;
  const msg=e.target.previousElementSibling, open=msg.classList.toggle('clip');
  e.target.textContent=open?'Show full message':'Show less';
});
for(const s of ['#search','#country','#interest']) $(s).addEventListener('input',render);

$('#csv').addEventListener('click',()=>{
  const cols=['created_at','name','company','email','phone','country','interest','message'];
  const cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv=[cols.join(',')].concat(visible().map(r=>cols.map(c=>cell(r[c])).join(','))).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));
  a.download='global-mino-enquiries-'+new Date().toISOString().slice(0,10)+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
});

function signOut(message){
  sessionStorage.removeItem(KEY);
  clearInterval(timer); timer=null;
  app.hidden=true; gate.hidden=false;
  $('#gate-error').textContent=message||'';
  document.title='Enquiries | Global Mino';
}
$('#signout').addEventListener('click',()=>signOut());

$('#gate-form').addEventListener('submit',async e=>{
  e.preventDefault();
  const token=$('#token').value.trim();
  if(!token)return;
  $('#gate-error').textContent='Checking…';
  const r=await fetch('/api/enquiries',{headers:{Authorization:'Bearer '+token}}).catch(()=>null);
  if(!r)return $('#gate-error').textContent='Network error. Try again.';
  if(r.status===401)return $('#gate-error').textContent='That token was not accepted.';
  if(!r.ok)return $('#gate-error').textContent='Server error ('+r.status+').';
  sessionStorage.setItem(KEY,token);
  $('#token').value='';
  start();
});

function start(){
  gate.hidden=true; app.hidden=false;
  load().then(()=>{
    // Mark everything currently loaded as seen once the operator has looked at it.
    setTimeout(()=>{sessionStorage.setItem(SEEN,String(Date.now()));},8000);
  });
  clearInterval(timer);
  timer=setInterval(load,30000);
}

if(sessionStorage.getItem(KEY)) start();
</script>
</body>
</html>
